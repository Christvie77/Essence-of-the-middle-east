<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Essence of the Middle East</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        :root{
            --gold:#c79a5b;
            --dark:#050505;
        }

        body{
            background: var(--dark);
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box{
            background:#0d0d0d;
            padding:40px;
            width:100%;
            max-width:450px;
            border:1px solid #1f1f1f;
            border-radius:10px;
            text-align:center;
        }

        /* LOGO (BIGGER) */
        .logo{
            width:85px;
            margin-bottom:12px;
        }

        /* TITLE (RESTORED FONT) */
        .title{
            font-family:'Cormorant Garamond', serif;
            font-size:2rem;
            font-weight:600;
            margin-bottom:25px;
        }

        .title .login-text{
            color: var(--gold);
        }

        .form-control{
            background:#111;
            border:1px solid #222;
            color:white;
            padding:12px;
        }

        .form-control:focus{
            border-color: var(--gold);
            box-shadow:none;
        }

        .btn-gold{
            background: var(--gold);
            border:none;
            color:black;
            padding:12px;
            width:100%;
            font-weight:600;
            margin-top:10px;
        }

        .btn-gold:hover{
            background:#d6ae73;
        }

        .small-text{
            text-align:center;
            margin-top:15px;
            color:#aaa;
            font-size:14px;
        }

        a{
            color: var(--gold);
            text-decoration:none;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <!-- LOGO -->
        <img src="images/logo.png" alt="Logo" class="logo">

        <!-- TITLE -->
        <div class="title">
            <span class="login-text">Login</span>
        </div>

        <!-- FORM -->
        <form>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-gold">
                LOGIN
            </button>

        </form>

        <!-- LINKS -->
        <div class="small-text">

            <p>
                Don't have an account?
                <a href="Signup.html">Sign up</a>
            </p>

            <p>
                <a href="Resetpassword.html">Forgot password?</a>
            </p>

            <p>
                <a href="Home.html">← Back to Home</a>
            </p>

        </div>

    </div>

</body>
</html>
