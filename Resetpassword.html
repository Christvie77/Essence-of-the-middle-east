<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Essence of the Middle East</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        :root{
            --gold:#c79a5b;
            --dark:#050505;
        }

        body{
            background: var(--dark);
            color: white;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-box{
            background:#0d0d0d;
            padding:40px;
            width:100%;
            max-width:450px;
            border:1px solid #1f1f1f;
            border-radius:10px;
        }

        .brand{
            font-family:'Cormorant Garamond', serif;
            font-size:2rem;
            text-align:center;
            margin-bottom:20px;
            letter-spacing:2px;
        }

        .brand span{
            color: var(--gold);
        }

        .form-control{
            background:#111;
            border:1px solid #222;
            color:white;
            padding:12px;
        }

        .form-control:focus{
            border-color: var(--gold);
            box-shadow:none;
            background:#111;
            color:white;
        }

        .btn-gold{
            background: var(--gold);
            border:none;
            color:black;
            padding:12px;
            width:100%;
            font-weight:600;
            margin-top:10px;
        }

        .btn-gold:hover{
            background:#d6ae73;
        }

        .small-text{
            text-align:center;
            margin-top:15px;
            color:#aaa;
            font-size:14px;
        }

        a{
            color: var(--gold);
            text-decoration:none;
        }

    </style>
</head>

<body>

    <div class="reset-box">

        <!-- TITLE -->
        <div class="brand">
            Reset <span>Password</span>
        </div>

        <!-- FORM -->
        <form>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <!-- New Password -->
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" placeholder="Enter new password">
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Confirm password">
            </div>

            <!-- Reset Button -->
            <button type="submit" class="btn btn-gold">
                RESET PASSWORD
            </button>

        </form>

        <!-- LINKS -->
        <div class="small-text">
            <a href="Login.html">Back to Login</a>
            <br><br>
            <a href="Home.html">← Back to Home</a>
        </div>

    </div>

</body>
</html>
