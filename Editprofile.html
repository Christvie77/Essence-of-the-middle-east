<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Essence</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        :root{
            --gold:#c79a5b;
            --dark:#050505;
        }

        body{
            background:var(--dark);
            color:white;
            font-family:'Poppins', sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .box{
            background:#0d0d0d;
            padding:40px;
            width:100%;
            max-width:500px;
            border:1px solid #1f1f1f;
            border-radius:10px;
        }

        .title{
            text-align:center;
            font-family:'Cormorant Garamond', serif;
            font-size:2rem;
            margin-bottom:20px;
            letter-spacing:2px;
        }

        .title span{
            color:var(--gold);
        }

        .form-control{
            background:#111;
            border:1px solid #222;
            color:white;
            padding:12px;
        }

        .form-control:focus{
            border-color:var(--gold);
            box-shadow:none;
            background:#111;
            color:white;
        }

        .btn-gold{
            background:var(--gold);
            color:black;
            font-weight:600;
            width:100%;
            padding:12px;
            border:none;
        }

        .btn-gold:hover{
            background:#d6ae73;
        }

        .links{
            text-align:center;
            margin-top:15px;
            font-size:14px;
        }

        a{
            color:var(--gold);
            text-decoration:none;
        }

    </style>
</head>

<body>

<div class="box">

    <!-- TITLE -->
    <div class="title">
        Edit <span>Profile</span>
    </div>

    <!-- FORM -->
    <form>

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" value="Chris Kabangu">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="chriskabangu@gmail.com">
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" value="+27 000 000 000">
        </div>

        <button type="submit" class="btn btn-gold">
            SAVE CHANGES
        </button>

    </form>

    <!-- NAV LINKS -->
    <div class="links">
        <a href="Dashboard.html">← Back to Dashboard</a>
        <br><br>
        <a href="Home.html">Home</a>
    </div>

</div>

</body>
</html>
